{% extends 'base.html' %}
{% block content %}

<h3>Register</h3>

<form method="POST">
    Username: <input type="text" name="username"><br><br>
    Password: <input type="password" name="password"><br><br>

    Role:
    <select name="role">
        <option value="reader">Reader</option>
        <option value="publisher">Publisher</option>
    </select><br><br>

    <button type="submit">Register</button>
</form>

{% endblock %}
