{% extends 'base.html' %}
{% block content %}
<h3>Borrowed Books Report</h3>
<table border="1" cellpadding="8">
<tr>
<th>Book</th><th>Borrower</th><th>Phone</th><th>Borrow Date</th><th>Return Date</th><th>Fine</th>
</tr>
{% for row in data %}
<tr>
<td>{{ row.title }}</td>
<td>{{ row.username }}</td>
<td>{{ row.phone }}</td>
<td>{{ row.borrow_date }}</td>
<td>{{ row.return_date }}</td>
<td>{{ row.fine }}</td>
</tr>
{% endfor %}
</table>
{% endblock %}
